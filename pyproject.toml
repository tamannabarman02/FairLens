[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairlens"
version = "0.1.0"
description = "Bias detection, mitigation and the FairLens Reliability Gate"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: loads real models (deselect with -m 'not slow')",
]
