# V4 1.2: compare CPU vs MPS outputs on Apple silicon (GitHub macOS arm64 runners expose MPS).
# Manual trigger only (downloads ~800 MB of models). Result is uploaded as an artifact.
name: device-match
on:
  workflow_dispatch:

jobs:
  mps-vs-cpu:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        env:
          PYTHON: python
        run: bash install.sh
      - name: Compare devices
        run: .venv/bin/python scripts/device_match.py --out device_match_macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: device-match-macos
          path: device_match_macos.json
