# V4 1.2c: install with the project's own install scripts and run the fast tests on all three systems.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (Windows, install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHON: python
        run: ./install.ps1
      - name: Install (macOS/Linux, install.sh)
        if: runner.os != 'Windows'
        env:
          PYTHON: python
        run: bash install.sh
      - name: Fast tests (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m pytest -q -m "not slow"
      - name: Fast tests (macOS/Linux)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest -q -m "not slow"
      - name: Device report
        if: always()
        shell: bash
        run: |
          if [ -f .venv/bin/python ]; then P=.venv/bin/python; else P=.venv/Scripts/python; fi
          $P -c "from fairlens import hardware as h; print(h.available_devices(), h.device())"
